[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "solana-anchor-events"
version = "0.1.0"
description = "Decode Anchor 0.30+ program events from Solana transaction logs, using only the IDL."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["solana", "anchor", "borsh", "idl", "events", "blockchain"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/markosnarinian/solana-anchor-events"

[tool.maturin]
# Mixed layout: pure-Python package under python/ wraps the compiled submodule
# and ships the PEP 561 type stubs (.pyi + py.typed).
python-source = "python"
module-name = "solana_anchor_events._solana_anchor_events"
# Build an abi3 extension module. The single abi3-py39 wheel works on any
# CPython >= 3.9.
features = ["pyo3/extension-module"]
